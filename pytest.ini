[pytest]
norecursedirs = env/*
addopts = -p no:cacheprovider
testpaths = tests/
python_files = test_*.py
env =
    PYTHONPATH=./
    FLASK_APP=yacut
    SECRET_KEY=1234test4321
filterwarnings =
    ignore:datetime.datetime.utcfromtimestamp\(\) is deprecated.*:DeprecationWarning:dateutil\..*
    ignore:datetime.datetime.utcnow\(\) is deprecated.*:DeprecationWarning:sqlalchemy\..*
    ignore:Inheritance class InterceptedClientSession from ClientSession is discouraged:DeprecationWarning
